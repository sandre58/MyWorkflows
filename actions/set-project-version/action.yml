name: 'Set Project Version'
description: 'Set version for a single .NET project using semantic versioning and NBGV'
author: 'sandre58'

inputs:
  project-path:
    description: 'Path to the .csproj file'
    required: true
  project-name:
    description: 'Name of the project'
    required: true
  project-dir:
    description: 'Directory containing the project'
    required: true
  tag-pattern:
    description: 'Pattern for tag names, e.g. {project}/v{version} or v{version}'
    required: false
    default: '{project}/v{version}'
  dotnet-versions:
    description: 'Versions of .NET to install'
    required: false
    default: |
      10.0.x
      9.0.x
      8.0.x
  install-web-workload:
    description: "Install ASP.NET Core workload for web development"
    required: false
    default: 'false'
  install-maui-workload:
    description: "Install .NET MAUI workload for cross-platform mobile and desktop development"
    required: false
    default: 'false'
  install-ios-workload:
    description: "Install iOS workload for iOS development"
    required: false
    default: 'false'
  install-android-workload:
    description: "Install Android workload for Android development"
    required: false
    default: 'false'
  install-maccatalyst-workload:
    description: "Install MacCatalyst workload for macOS development"
    required: false
    default: 'false'
  install-windows-workload:
    description: "Install Windows workload for Windows desktop development"
    required: false
    default: 'false'
  install-wasm-workload:
    description: "Install WebAssembly workload for Blazor WebAssembly development"
    required: false
    default: 'false'

outputs:
  version:
    description: 'Computed version for the project'
    value: ${{ steps.version.outputs.version }}
  changed:
    description: 'Whether the version has changed'
    value: ${{ steps.version.outputs.changed }}

runs:
  using: 'composite'
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-versions }}

    - name: Install Web Workload
      if: inputs.install-web-workload == 'true'
      shell: bash
      run: |
        echo "Installing ASP.NET Core workload..."
        dotnet workload install aspire

    - name: Install MAUI Workload
      if: inputs.install-maui-workload == 'true'
      shell: bash
      run: |
        echo "Installing .NET MAUI workload..."
        dotnet workload install maui

    - name: Install iOS Workload
      if: inputs.install-ios-workload == 'true'
      shell: bash
      run: |
        echo "Installing iOS workload..."
        dotnet workload install ios

    - name: Install Android Workload
      if: inputs.install-android-workload == 'true'
      shell: bash
      run: |
        echo "Installing Android workload..."
        dotnet workload install android

    - name: Install MacCatalyst Workload
      if: inputs.install-maccatalyst-workload == 'true'
      shell: bash
      run: |
        echo "Installing MacCatalyst workload..."
        dotnet workload install maccatalyst

    - name: Install Windows Workload
      if: inputs.install-windows-workload == 'true'
      shell: bash
      run: |
        echo "Installing Windows workload..."
        dotnet workload install maui-windows

    - name: Install WebAssembly Workload
      if: inputs.install-wasm-workload == 'true'
      shell: bash
      run: |
        echo "Installing WebAssembly workload..."
        dotnet workload install wasm-tools

    - name: Calculate tag pattern for ${{ inputs.project-name }}
      id: calculate-tag-pattern
      shell: bash
      run: |
        tag_pattern="${{ inputs.tag-pattern }}"
        project_tag_pattern="${tag_pattern//\{project\}/${{ inputs.project-name }}}"
        echo "tag-pattern=$project_tag_pattern" >> $GITHUB_OUTPUT

    - name: Compute version for ${{ inputs.project-name }}
      id: version
      uses: sandre58/MyWorkflows/actions/compute-version@main
      with:
        tag-pattern: ${{ steps.calculate-tag-pattern.outputs.tag-pattern }}
        working-directory: ${{ inputs.project-dir }}

    - name: Set NBGV version for ${{ inputs.project-name }}
      uses: sandre58/MyWorkflows/actions/set-nbgv-version@main
      with:
        version: ${{ steps.version.outputs.version }}
        working-directory: ${{ inputs.project-dir }}
        project-name: ${{ inputs.project-name }}

    - name: Add NBGV package to ${{ inputs.project-name }}
      uses: sandre58/MyWorkflows/actions/add-nbgv-package@main
      with:
        dotnet-versions: ${{ inputs.dotnet-versions }}
        working-directory: ${{ inputs.project-dir }}
        project-name: ${{ inputs.project-name }}