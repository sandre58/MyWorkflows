name: 'GitVersion'
description: 'Calculate version using GitVersion'
author: 'sandre58'

outputs:
  semver:
    description: 'Semantic version (e.g., 1.2.3)'
    value: ${{ steps.gitversion.outputs.semVer }}
  fullsemver:
    description: 'Full semantic version (e.g., 1.2.3-beta.1+commitId)'
    value: ${{ steps.gitversion.outputs.fullSemVer }}
  major:
    description: 'Major version number'
    value: ${{ steps.gitversion.outputs.major }}
  minor:
    description: 'Minor version number'
    value: ${{ steps.gitversion.outputs.minor }}
  patch:
    description: 'Patch version number'
    value: ${{ steps.gitversion.outputs.patch }}
  prereleasetag:
    description: 'Pre-release tag (e.g., beta, alpha)'
    value: ${{ steps.gitversion.outputs.preReleaseTag }}
  assemblysemver:
    description: 'Assembly semantic version'
    value: ${{ steps.gitversion.outputs.assemblySemVer }}
  informationalversion:
    description: 'Informational version'
    value: ${{ steps.gitversion.outputs.informationalVersion }}

runs:
  using: 'composite'
  steps:
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v1.1.1
      with:
        versionSpec: '5.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v1.1.1
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml

    - name: Display GitVersion outputs
      shell: bash
      run: |
        echo "GitVersion SemVer: ${{ steps.gitversion.outputs.semVer }}"
        echo "GitVersion FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
        echo "GitVersion Major: ${{ steps.gitversion.outputs.major }}"
        echo "GitVersion Minor: ${{ steps.gitversion.outputs.minor }}"
        echo "GitVersion Patch: ${{ steps.gitversion.outputs.patch }}"
        echo "GitVersion PreReleaseTag: ${{ steps.gitversion.outputs.preReleaseTag }}"
        echo "GitVersion AssemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}"
        echo "GitVersion InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"