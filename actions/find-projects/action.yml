name: 'Find .NET Projects'
description: 'Discover .NET project files and create a matrix strategy for parallel processing'
author: 'sandre58'

inputs:
  project-paths:
    description: 'List of csproj files or folders (newline separated)'
    required: false
    default: 'src'
  max-depth:
    description: 'Maximum search depth for finding projects (empty = all subfolders)'
    required: false

outputs:
  projects:
    description: 'Comma-separated list of project names'
    value: ${{ steps.find-projects.outputs.projects }}
  projects-matrix:
    description: 'JSON matrix for parallel processing'
    value: ${{ steps.find-projects.outputs.projects-matrix }}
  projects-list:
    description: 'JSON array of project paths for iteration (can be used with fromJSON in for loops)'
    value: ${{ steps.find-projects.outputs.projects-list }}

runs:
  using: 'composite'
  steps:
    - name: Find all projects
      id: find-projects
      shell: bash
      run: |
        echo "🔍 Searching for .csproj files in provided paths..."
        
        # Check if project-paths is empty
        if [[ -z "${{ inputs.project-paths }}" ]]; then
          echo "❌ No project paths provided"
          echo "projects=" >> $GITHUB_OUTPUT
          echo "projects-matrix={\"include\":[]}" >> $GITHUB_OUTPUT
          echo "projects-list=[]" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        all_projects=""
        while IFS= read -r path; do
          if [[ -z "$path" ]]; then
            continue
          fi
          if [[ -f "$path" && "$path" == *.csproj ]]; then
            all_projects+="$path\n"
          elif [[ -d "$path" ]]; then
            if [[ -n "${{ inputs.max-depth }}" ]]; then
              found=$(find "$path" -maxdepth ${{ inputs.max-depth }} -name "*.csproj" -type f)
            else
              found=$(find "$path" -name "*.csproj" -type f)
            fi
            if [[ -n "$found" ]]; then
              all_projects+="$found\n"
            fi
          else
            echo "⚠️ Warning: Path '$path' does not exist or is not a valid .csproj file or directory"
          fi
        done <<< "${{ inputs.project-paths }}"

        # Remove empty lines
        all_projects=$(echo -e "$all_projects" | grep -v '^$')

        if [[ -z "$all_projects" ]]; then
          echo "❌ No .csproj files found"
          echo "projects=" >> $GITHUB_OUTPUT
          echo "projects-matrix={\"include\":[]}" >> $GITHUB_OUTPUT
          echo "projects-list=[]" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Build JSON array for matrix strategy and projects list
        matrix_json="{"
        matrix_json+='"include":['
        
        # Build simple JSON array for iteration
        projects_array="["

        project_list=""
        first=true
        first_array=true

        while IFS= read -r project_path; do
          if [[ -n "$project_path" ]]; then
            # Normalize paths by removing leading ./
            project_path="${project_path#./}"
            project_dir=$(dirname "$project_path")
            project_dir="${project_dir#./}"
            project_name=$(basename "$project_path" .csproj)

            # Double-check file existence
            if [[ ! -f "$project_path" ]]; then
              echo "⚠️ Warning: Project file '$project_path' was found by find but doesn't exist now - skipping"
              continue
            fi

            if [[ "$first" == true ]]; then
              first=false
            else
              matrix_json+=","
              project_list+=","
            fi

            if [[ "$first_array" == true ]]; then
              first_array=false
            else
              projects_array+=","
            fi

            matrix_json+="{\"name\":\"$project_name\",\"path\":\"$project_path\",\"dir\":\"$project_dir\"}"
            project_list+="$project_name"
            projects_array+="\"$project_path\""

            echo "✅ Found project: $project_name at $project_path"
          fi
        done <<< "$all_projects"

        matrix_json+=']}'
        projects_array+="]"

        echo "projects=$project_list" >> $GITHUB_OUTPUT
        echo "projects-matrix=$matrix_json" >> $GITHUB_OUTPUT
        echo "projects-list=$projects_array" >> $GITHUB_OUTPUT
        echo "Projects matrix: $matrix_json"
        echo "Projects list: $projects_array"