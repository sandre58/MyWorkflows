name: "Publish .NET App"
description: "Publish a .NET application with specified configuration"
inputs:
  output-path:
    description: "Output directory for published files"
    required: false
    default: 'apps'
  project-path:
    description: "Path to the project file (.csproj)"
    required: true
  version:
    description: "Version to use for the publish"
    required: false
  configuration:
    description: "Publish configuration (Release, Debug, etc.)"
    required: false
    default: 'Release'
  dotnet-versions:
    description: "Versions of .NET to install"
    required: false
    default: |
      10.0.x
      9.0.x
      8.0.x
  framework:
    description: "Target framework for publish (e.g. net8.0, net6.0)"
    required: false
  publish-args:
    description: "Additional arguments for dotnet publish command"
    required: false
    default: '--self-contained true --runtime win-x64 -p:PublishSingleFile=true'
  install-web-workload:
    description: "Install ASP.NET Core workload for web development"
    required: false
    default: 'false'
  install-maui-workload:
    description: "Install .NET MAUI workload for cross-platform mobile and desktop development"
    required: false
    default: 'false'
  install-ios-workload:
    description: "Install iOS workload for iOS development"
    required: false
    default: 'false'
  install-android-workload:
    description: "Install Android workload for Android development"
    required: false
    default: 'false'
  install-maccatalyst-workload:
    description: "Install MacCatalyst workload for macOS development"
    required: false
    default: 'false'
  install-windows-workload:
    description: "Install Windows workload for Windows desktop development"
    required: false
    default: 'false'
  install-wasm-workload:
    description: "Install WebAssembly workload for Blazor WebAssembly development"
    required: false
    default: 'false'


outputs:
  output-directory:
    description: "Output directory containing app files"
    value: ${{ inputs.output-path }}

runs:
  using: "composite"
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-versions }}

    - name: Install Web Workload
      if: inputs.install-web-workload == 'true'
      shell: bash
      run: |
        echo "Installing ASP.NET Core workload..."
        dotnet workload install aspire

    - name: Install MAUI Workload
      if: inputs.install-maui-workload == 'true'
      shell: bash
      run: |
        echo "Installing .NET MAUI workload..."
        dotnet workload install maui

    - name: Install iOS Workload
      if: inputs.install-ios-workload == 'true'
      shell: bash
      run: |
        echo "Installing iOS workload..."
        dotnet workload install ios

    - name: Install Android Workload
      if: inputs.install-android-workload == 'true'
      shell: bash
      run: |
        echo "Installing Android workload..."
        dotnet workload install android

    - name: Install MacCatalyst Workload
      if: inputs.install-maccatalyst-workload == 'true'
      shell: bash
      run: |
        echo "Installing MacCatalyst workload..."
        dotnet workload install maccatalyst

    - name: Install Windows Workload
      if: inputs.install-windows-workload == 'true'
      shell: bash
      run: |
        echo "Installing Windows workload..."
        dotnet workload install maui-windows

    - name: Install WebAssembly Workload
      if: inputs.install-wasm-workload == 'true'
      shell: bash
      run: |
        echo "Installing WebAssembly workload..."
        dotnet workload install wasm-tools

    - name: Publish
      shell: bash
      run: |
        publish_args="--configuration ${{ inputs.configuration }}"

        if [[ -n "${{ inputs.version }}" ]]; then
          publish_args="$publish_args -p:Version=${{ inputs.version }} -p:AssemblyVersion=${{ inputs.version }} -p:FileVersion=${{ inputs.version }}"
        fi

        if [[ -n "${{ inputs.framework }}" ]]; then
          publish_args="$publish_args -f ${{ inputs.framework }}"
        fi

        if [[ -n "${{ inputs.publish-args }}" ]]; then
          publish_args="$publish_args ${{ inputs.publish-args }}"
        fi

        if [[ -n "${{ inputs.output-path }}" ]]; then
          publish_args="$publish_args --output ${{ inputs.output-path }}"
        fi

        dotnet publish ${{ inputs.project-path }} $publish_args
