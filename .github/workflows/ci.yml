name: CI

on:
  workflow_call:
    inputs:
      dotnet-versions:
        description: "Versions of .NET to install"
        type: string
        default: |
          10.0.x
          9.0.x
          8.0.x
      configuration:
        description: "Build configuration (Release, Debug, etc.)"
        type: string
        required: false
        default: 'Release'
      nuget-projects:
        description: "List of csproj files to pack (newline separated)"
        type: string
        required: false
        default: 'src'
      nuget-output:
        description: "Output directory for published nugets"
        type: string
        required: false
        default: 'packages'
      nuget-source:
        description: "NuGet source URL for stable releases"
        type: string
        default: 'https://api.nuget.org/v3/index.json'
      nuget-push-args:
        description: "Additional arguments for dotnet nuget push command"
        type: string
        required: false
        default: '--skip-duplicate'
      app-projects:
        description: "List of csproj files to publish (newline separated)"
        type: string
        required: false
        default: ''
      app-output:
        description: "Output directory for published apps"
        type: string
        required: false
        default: 'apps'
      app-target-framework:
        description: "Target framework for app publish (e.g. net8.0, net6.0)"
        type: string
        required: false
      app-publish-args:
        description: "Additional arguments for dotnet publish command"
        type: string
        required: false
        default: '--self-contained true --runtime win-x64 -p:PublishSingleFile=true'
      build-args:
        description: "Additional arguments for dotnet build command"
        type: string
        required: false
      tests-path:
        description: "Path to search for test files"
        type: string
        default: 'TestResults'
      runsettings-file:
        description: "Path to .runsettings file for test configuration"
        type: string
        required: false
        default: '.runsettings'
      test-args:
        description: "Additional arguments for dotnet test command"
        type: string
        required: false
      test-loggers:
        description: "Test loggers to use (space-separated)"
        type: string
        required: false
        default: 'GitHubActions trx'
      changelog-path:
        description: "Path to the changelog file"
        type: string
        default: 'CHANGELOG.md'
      install-web-workload:
        description: "Install ASP.NET Core workload for web development"
        type: boolean
        default: false
      install-maui-workload:
        description: "Install .NET MAUI workload for cross-platform mobile and desktop development"
        type: boolean
        default: false
      install-ios-workload:
        description: "Install iOS workload for iOS development"
        type: boolean
        default: false
      install-android-workload:
        description: "Install Android workload for Android development"
        type: boolean
        default: false
      install-maccatalyst-workload:
        description: "Install MacCatalyst workload for macOS development"
        type: boolean
        default: false
      install-windows-workload:
        description: "Install Windows workload for Windows desktop development"
        type: boolean
        default: false
      install-wasm-workload:
        description: "Install WebAssembly workload for Blazor WebAssembly development"
        type: boolean
        default: false
    secrets:
      NUGET_API_KEY:
        description: "API key for publishing stable releases"
        required: true

permissions:
  checks: write        # Required to publish test results
  actions: read        # Required to read workflow runs
  contents: write      # Required to checkout code and push to gh-pages
  pages: write         # Required to publish to GitHub Pages

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-test-pack:
    name: Build, Test and Pack
    runs-on: windows-latest
    outputs:
      has-test-results: ${{ steps.check_test_results.outputs.found }}
      is-prerelease: ${{ steps.gitversion.outputs.preReleaseTag != '' }}
      semVer: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-versions }}

      - name: Install Web Workload
        if: inputs.install-web-workload == 'true'
        shell: bash
        run: |
          echo "Installing ASP.NET Core workload..."
          dotnet workload install aspire

      - name: Install MAUI Workload
        if: inputs.install-maui-workload == 'true'
        shell: bash
        run: |
          echo "Installing .NET MAUI workload..."
          dotnet workload install maui

      - name: Install iOS Workload
        if: inputs.install-ios-workload == 'true'
        shell: bash
        run: |
          echo "Installing iOS workload..."
          dotnet workload install ios

      - name: Install Android Workload
        if: inputs.install-android-workload == 'true'
        shell: bash
        run: |
          echo "Installing Android workload..."
          dotnet workload install android

      - name: Install MacCatalyst Workload
        if: inputs.install-maccatalyst-workload == 'true'
        shell: bash
        run: |
          echo "Installing MacCatalyst workload..."
          dotnet workload install maccatalyst

      - name: Install Windows Workload
        if: inputs.install-windows-workload == 'true'
        shell: bash
        run: |
          echo "Installing Windows workload..."
          dotnet workload install maui-windows

      - name: Install WebAssembly Workload
        if: inputs.install-wasm-workload == 'true'
        shell: bash
        run: |
          echo "Installing WebAssembly workload..."
          dotnet workload install wasm-tools

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1.1.1
        with:
          versionSpec: '5.x'

      - name: Initialize GitVersion
        shell: bash
        run: |
          echo "Checking if GitVersion configuration exists..."
          if [[ ! -f "GitVersion.yml" ]]; then
            echo "⚠️ GitVersion.yml not found, downloading default configuration..."
            
            # Download the default GitVersion.yml from the MyWorkflows repository
            default_config_url="https://raw.githubusercontent.com/sandre58/MyWorkflows/main/defaults/GitVersion.yml"
            
            if curl -fsSL "$default_config_url" -o GitVersion.yml; then
              echo "✅ Downloaded default GitVersion.yml configuration"
            else
              echo "❌ Failed to download default configuration, creating fallback..."
            fi
          else
            echo "✅ GitVersion.yml already exists"
          fi
          
          echo "📋 GitVersion configuration:"
          cat GitVersion.yml

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1.1.1
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Build
        shell: bash
        run: |
          build_args="--configuration ${{ inputs.configuration }}"
 
          if [[ -n "${{ inputs.build-args }}" ]]; then
            build_args="$build_args ${{ inputs.build-args }}"
          fi
          
          dotnet build $build_args

      - name: Test
        shell: bash
        run: |
          test_args="--configuration ${{ inputs.configuration }}"
          
          # Add runsettings file if specified
          if [[ -n "${{ inputs.runsettings-file }}" ]]; then
            test_args="$test_args --settings ${{ inputs.runsettings-file }}"
          fi
          
          # Add loggers
          if [[ -n "${{ inputs.test-loggers }}" ]]; then
            IFS=' ' read -ra loggers <<< "${{ inputs.test-loggers }}"
            for logger in "${loggers[@]}"; do
              test_args="$test_args --logger $logger"
            done
          fi
          
          # Add custom test arguments
          if [[ -n "${{ inputs.test-args }}" ]]; then
            test_args="$test_args ${{ inputs.test-args }}"
          fi
          
          dotnet test --no-build $test_args

      - name: Find all NuGets projects
        id: find-nuget-projects
        if: ${{ inputs.nuget-projects != '' }}
        uses: sandre58/MyWorkflows/actions/find-projects@main
        with:
          project-paths: ${{ inputs.nuget-projects }}

      - name: Find all app projects
        id: find-app-projects
        if: ${{ inputs.app-projects != '' }}
        uses: sandre58/MyWorkflows/actions/find-projects@main
        with:
          project-paths: ${{ inputs.app-projects }}

      - name: Pack NuGets
        shell: bash
        if: ${{ steps.find-nuget-projects.outputs.projects != '' }}
        run: |
          set -e  # Exit on any error initially
          
          packed_count=0
          skipped_count=0
          
          # Disable exit on error for the packing loop
          set +e

          for file in $(echo '${{ steps.find-nuget-projects.outputs.projects-list }}' | jq -r '.[]'); do

            project_name=$(basename "$file" .csproj)

            # Pack the project
            echo "📦 Packing project '$project_name'..."
            if dotnet pack "$file" --configuration ${{ inputs.configuration }} --no-build --output "${{ inputs.nuget-output }}/"; then
              echo "✅ Successfully packed '$project_name'"
              ((packed_count++))
            else
              echo "⏭️  Skipping project '$project_name' - not packable or pack failed"
              ((skipped_count++))
            fi
            
          done
          
          # Re-enable exit on error
          set -e
          
          echo "📊 Pack Summary:"
          echo "  ✅ Packed: $packed_count projects"
          echo "  ⏭️ Skipped: $skipped_count projects"

      - name: Publish Apps
        shell: bash
        if: ${{ steps.find-app-projects.outputs.projects != '' }}
        run: |
          published_count=0

          publish_args="--configuration ${{ inputs.configuration }}"

          if [[ -n "${{ inputs.app-target-framework }}" ]]; then
            publish_args="$publish_args -f ${{ inputs.app-target-framework }}"
          fi

          if [[ -n "${{ inputs.app-publish-args }}" ]]; then
            publish_args="$publish_args ${{ inputs.app-publish-args }}"
          fi

          for file in $(echo '${{ steps.find-app-projects.outputs.projects-list }}' | jq -r '.[]'); do

            project_name=$(basename "$file" .csproj)
            publishDir="${{ inputs.app-output }}/$project_name"

            # Publish the project
            echo "📦 Publishing project '$project_name'..."
            dotnet publish $file --output $publishDir $publish_args

            # Zip file
            zipFile="${{ inputs.app-output }}/$project_name.zip"
            Write-Host "Creating zip file: $zipFile"
            Compress-Archive -Path "$publishDir/*" -DestinationPath $zipFile -Force
            Write-Host "✅ Zip file created successfully"

            ((published_count++))
            
          done
          
          echo "📊 Publish Summary:"
          echo "  ✅ Published: $published_count projects"

      - name: Push NuGets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          echo "➡️ Publishing RELEASE packages to: ${{ inputs.nuget-source }}"
          push_args="--api-key ${{ secrets.NUGET_API_KEY }}"
          push_args="$push_args --source ${{ inputs.nuget-source }}"

          if [[ -n "${{ inputs.nuget-push-args }}" ]]; then
            push_args="$push_args ${{ inputs.nuget-push-args }}"
          fi
          
          for file in $(find artifacts -name "*.nupkg"); do
            echo "Pushing $file..."
            dotnet nuget push "$file" $push_args
          done

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ inputs.nuget-output }}/*.nupkg
          if-no-files-found: ignore

      - name: Upload Apps
        uses: actions/upload-artifact@v4
        with:
          name: apps
          path: ${{ inputs.app-output }}/*.zip
          if-no-files-found: ignore

      - name: Check Test Files
        id: check_test_results
        shell: bash
        run: |
          if compgen -G "${{ inputs.tests-path }}/**/*" > /dev/null; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload test results
        if: steps.check_test_results.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ inputs.tests-path }}/**/*

  publish-tests-reports:
    runs-on: ubuntu-latest
    needs: build-test-pack
    if: always() && needs.build-test-pack.outputs.has-test-results == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Check if test results artifact exists
        id: check-artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: ${{ inputs.tests-path }}

      - name: Publish Coverage Report
        if: steps.check-artifact.outcome == 'success'
        uses: codecov/codecov-action@v4
        with:
          files: ${{ inputs.tests-path }}/**/*.cobertura.xml
          fail_ci_if_error: false
          verbose: true

      - name: Generate coverage report
        if: steps.check-artifact.outcome == 'success'
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: '${{ inputs.tests-path }}/**/*.cobertura.xml'
          targetdir: 'coveragereport'
          reporttypes: 'Html;MarkdownSummaryGithub'

      - name: Publish Test Results
        if: steps.check-artifact.outcome == 'success'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ${{ inputs.tests-path }}/**/*.trx
          check_name: 'Test Results'
          comment_mode: changes
          fail_on: 'test failures'

      - name: Publish Markdown Summary
        if: steps.check-artifact.outcome == 'success'
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Reports
        if: steps.check-artifact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport

      - name: Deploy documentation to GitHub Pages
        if: steps.check-artifact.outcome == 'success' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: coveragereport

  create-release:
    runs-on: ubuntu-latest
    needs: [build-test-pack]
    if: startsWith(github.ref, 'refs/tags/') && needs.build-test-pack.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Calculate changelog tag range
        id: tag-range
        uses: sandre58/MyWorkflows/actions/calculate-tag-range@main
        with:
          current-tag: ${{ github.ref_name }}

      - name: Generate Changelog
        id: changelog
        uses: sandre58/MyWorkflows/actions/generate-changelog@main
        with:
          tag: ${{ steps.tag-range.outputs.tag-range }}
          repository-url: ${{ github.server_url }}/${{ github.repository }}
          title: ${{ github.ref_name }}
          template-file: ".chglog/RELEASE.tpl.md"
          changelog-path: ${{ inputs.changelog-path }}

      - name: Clean repository before changelog
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -fdx

      - name: Generate Full Changelog
        uses: sandre58/MyWorkflows/actions/generate-changelog@main
        with:
          tag: ${{ github.ref_name }}
          repository-url: ${{ github.server_url }}/${{ github.repository }}
          title: ${{ github.ref_name }}
          output-file: ${{ inputs.changelog-path }}
          template-file: ".chglog/CHANGELOG.tpl.md"

      - name: Commit and push changelog
        shell: bash
        run: |
          changelog_path="${{ inputs.changelog-path }}"
          
          # Configure git for the action
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if changelog file was created and has changes
          if [[ -f "$changelog_path" ]]; then
            # Add the changelog file
            git add "$changelog_path"
            
            # Check if there are changes to commit
            if git diff --cached --quiet; then
              echo "No changes to commit for changelog"
            else
              # Commit the changelog
              git commit -m "docs: update CHANGELOG.md for ${{ github.ref_name }} [ci skip]"
              
              # Push the changes to main
              git push origin main
              
              echo "Changelog committed and pushed successfully to main"
            fi
          else
            echo "No changelog file found at: $changelog_path"
          fi

      - name: Download NuGets
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - name: Download Apps
        uses: actions/download-artifact@v4
        with:
          name: apps
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.build-test-pack.outputs.semVer }}
          body: ${{ steps.changelog.outputs.changelog-content }}
          draft: false
          prerelease: ${{ needs.build-test-pack.outputs.is-prerelease }}
          files: artifacts/*